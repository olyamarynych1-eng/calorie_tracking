<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Раціон</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:light;--ink:#111;--mute:#8a8f98;--line:#dfe2e6;--bg:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.3 -apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;padding:16px 16px 40px}
h1{font-size:28px;margin:8px 0 12px}
.top{text-align:center;margin:12px 0 18px}
.top b{font-size:40px;display:block}
.top span{color:var(--mute)}
.bar{display:flex;justify-content:space-between;color:var(--mute);margin:18px 0 8px}
.track{height:10px;background:#eceef1;border-radius:6px;overflow:hidden}
.fill{height:100%;width:0;background:#3b82f6;transition:width .2s}
.fill.over{background:#ef4444}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.card{display:flex;align-items:center;gap:10px;border:1px dashed var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.badge{flex:none;min-width:34px;text-align:center;color:#fff;font-weight:700;border-radius:8px;padding:4px 8px}
.info{flex:1;min-width:0}
.name{font-weight:600}
.sub{color:var(--mute);font-size:14px;margin-top:2px}
.qty{flex:none;text-align:right;white-space:nowrap;color:var(--mute);font-size:14px}
.qty input{width:64px;font:inherit;font-weight:600;color:var(--ink);text-align:right;border:1px solid var(--line);border-radius:8px;padding:4px 6px}
.qty input:focus{outline:2px solid #3b82f6}
.card.full{background:#f6f7f8}
.card.full .name{color:var(--mute)}
textarea{width:100%;min-height:80px;font:inherit;border:1px solid var(--line);border-radius:12px;padding:10px;resize:vertical}
button{width:100%;margin-top:12px;font:inherit;font-weight:600;color:#fff;background:#3b82f6;border:0;border-radius:12px;padding:14px}
.hint{color:var(--mute);font-size:14px;text-align:center;margin-top:10px}
</style>
</head>
<body>
<h1>Раціон</h1>
<div class="top"><b id="prot">0 грам</b><span>білків</span></div>
<div class="bar"><span>Калорії</span><span id="kc">0 / 0 ккал</span></div>
<div class="track"><div class="fill" id="fill"></div></div>
<hr>
<div id="list"></div>
<hr>
<textarea id="notes" placeholder="Якщо ви спожили щось поза межами програми, вкажіть тут."></textarea>
<button id="send">Надіслати звіт</button>
<div class="hint" id="date"></div>

<script>
const DAY_KCAL = 1955;

/* [назва, максимум на порожній групі (г або шт), ккал на цей максимум, білок на цей максимум, опції]
   опції: u = одиниця, share = яку частку групи займає максимум, cap = не більше максимуму */
const GROUPS = [
 {id:"А", color:"#3b82f6", items:[
  ["Бобові",64,198,12.8],["Будь-яка крупа",60,198,6],["Картопля",260,200,5.2],
  ["Кукурудза свіжа",232,200,7.7],["Лаваш",79,190,6.3],["Макарони т.с.",55,187,6.6],
  ["Рис (не шліфований)",60,198,4.5],["Хлібці",59,189,5.9],
  ["Цільнозернове борошно",59,189,6.5],["Цільнозерновий хліб",80,200,7.2]]},
 {id:"Б", color:"#ef4444", items:[
  ["Куряче або індиче філе",435,478,95.7],["Морепродукти",480,480,96],["Печінка",368,478,66.2],
  ["Риба (від 5% жиру)",279,474,50.2],["Риба (до 5% жиру)",435,478,87],
  ["Телятина",279,474,55.8],
  ["Яйця (цілі)",7,478,44,{u:"шт"}]]}, /* ккал і білок яєць — орієнтовні, перевірте */
 {id:"В", color:"#22c55e", items:[
  ["Гриби",600,120,21],["Овочі (квашені також і зелень)",600,120,9]]},
 {id:"Г", color:"#eab308", items:[
  ["Авокадо",100,160,2],["Будь-яка олія (рекомендуємо лляну)",17,153,0],["Гірчиця",120,78,6],
  ["Кетчуп",80,80,0.8],["Майонез",25,150,0.3],["Оливки",140,161,1.4]]},
 {id:"Д", color:"#a855f7", items:[
  ["Кефір 1%",510,224,16.3],["Молоко 1%",510,224,16.3], /* ккал молока — орієнтовні */
  ["Несолодкий йогурт 1% жиру",510,224,16.3],["Сир кисломолочний нежирний",280,224,50.4],
  ["Сири м'які, тверді, плавлені",60,210,12],["Сметана 15%",150,225,12]]},
 {id:"Е", color:"#ec4899", items:[
  ["Банани, виноград, хурма",230,218,2.3],["Фрукти та ягоди",440,220,4.4]]},
 {id:"Є", color:"#6b7280", items:[
  ["Будь-які горіхи (рекомендуємо грецькі)",10,60,2],["Насіння",10,60,2]]},
 {id:"Ж", color:"#f97316", items:[
  ["Банани, виноград, хурма",475,451,4.8],["Будь-що (солодощі, снеки, ковбаса ...)",90,450,4.5],
  ["Міцні алкогольні напої (НЕ КОЖНОГО ДНЯ)",50,110,0,{share:110/450,cap:true}],
  ["Пиво (НЕ КОЖНОГО ДНЯ!)",240,103,0,{share:103/450,cap:true}],
  ["Сухе вино (НЕ КОЖНОГО ДНЯ!)",150,104,0,{share:104/450,cap:true}],
  ["Фрукти та ягоди",900,450,9]]}
];

const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

/* ---------- сховище: Telegram CloudStorage, інакше localStorage ---------- */
const inTG = !!(tg && tg.initData && tg.CloudStorage);
const store = {
  get(k, cb){
    let done = false;
    const fin = v => { if (!done) { done = true; cb(v); } };
    const local = () => { try { return localStorage.getItem(k); } catch(e){ return null; } };
    if (inTG) {
      try { tg.CloudStorage.getItem(k, (e,v)=>fin(e || !v ? local() : v)); }
      catch(e){ fin(local()); }
      setTimeout(()=>fin(local()), 2500);   // якщо Telegram не відповів
    } else fin(local());
  },
  set(k, v){
    try { localStorage.setItem(k, v); } catch(e){}
    if (inTG) { try { tg.CloudStorage.setItem(k, v); } catch(e){} }
  }
};
const pad = n => String(n).padStart(2,"0");
const today = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };

/* ---------- модель ---------- */
const items = [];            // плоский список з посиланнями на DOM
let day = today();
let eaten = {};              // "А|Бобові": грами

GROUPS.forEach(g => g.items.forEach(([n,M,kcal,p,o={}]) => {
  items.push({g, key:g.id+"|"+n, n, M, kcal, p, u:o.u||"г", share:o.share||1, cap:!!o.cap});
}));
const used = (g, skip) => items.filter(i=>i.g===g && i!==skip)
  .reduce((s,i)=> s + (eaten[i.key]||0) * i.share / i.M, 0);
const maxFor = i => {
  const room = Math.max(0, 1 - used(i.g, i)) * i.M / i.share;
  return Math.floor((i.cap ? Math.min(i.M, room) : room) + 1e-9);
};

/* ---------- відображення ---------- */
const list = document.getElementById("list");
items.forEach(i => {
  const el = document.createElement("div");
  el.className = "card";
  el.innerHTML = `<span class="badge" style="background:${i.g.color}">${i.g.id}</span>
    <div class="info"><div class="name"></div><div class="sub"></div></div>
    <div class="qty"><input type="number" inputmode="decimal" min="0" placeholder="0"> / <span class="mx"></span></div>`;
  el.querySelector(".name").textContent = i.n;
  el.querySelector(".sub").textContent = `${i.kcal} ккал • ${i.p} г білка`;
  i.el = el; i.inp = el.querySelector("input"); i.mx = el.querySelector(".mx");
  i.inp.addEventListener("input", () => {
    let v = parseFloat(i.inp.value.replace(",", ".")) || 0;
    v = Math.max(0, Math.min(v, maxFor(i)));
    if (v) eaten[i.key] = v; else delete eaten[i.key];
    if (String(v) !== i.inp.value && i.inp.value !== "") i.inp.value = v;
    refresh(); save();
  });
  list.appendChild(el);
});

function refresh(){
  let kc = 0, pr = 0;
  items.forEach(i => {
    const cur = eaten[i.key] || 0, mx = maxFor(i);
    i.mx.textContent = mx + " " + i.u;
    i.el.classList.toggle("full", mx === 0 && !cur);
    if (document.activeElement !== i.inp) i.inp.value = cur || "";
    kc += cur / i.M * i.kcal; pr += cur / i.M * i.p;
  });
  kc = Math.round(kc);
  document.getElementById("prot").textContent = Math.round(pr*10)/10 + " грам";
  document.getElementById("kc").textContent = `${kc} / ${DAY_KCAL} ккал`;
  const f = document.getElementById("fill");
  f.style.width = Math.min(100, kc/DAY_KCAL*100) + "%";
  f.classList.toggle("over", kc > DAY_KCAL);
  document.getElementById("date").textContent =
    "Сьогодні: " + day.split("-").reverse().join(".") + ". О 00:00 день починається з нуля.";
}

/* ---------- збереження по даті: новий день = порожні дані ---------- */
const notesEl = document.getElementById("notes");
const save = () => store.set("day:" + day, JSON.stringify({eaten, notes: notesEl.value}));
notesEl.addEventListener("input", save);

function load(){
  day = today();
  store.get("day:" + day, v => {
    let d = {}; try { d = JSON.parse(v) || {}; } catch(e){}
    eaten = d.eaten || {}; notesEl.value = d.notes || "";
    refresh();
  });
}
refresh();
load();
setInterval(() => { if (today() !== day) load(); }, 15000);   // перехід через північ

/* ---------- звіт ---------- */
function report(){
  let kc = 0, pr = 0; const lines = [];
  GROUPS.forEach(g => {
    const part = items.filter(i => i.g === g && eaten[i.key]).map(i => {
      kc += eaten[i.key]/i.M*i.kcal; pr += eaten[i.key]/i.M*i.p;
      return `${i.n}: ${eaten[i.key]} ${i.u}`;
    });
    if (part.length) lines.push(`${g.id} — ` + part.join("; "));
  });
  let t = `Звіт за ${day.split("-").reverse().join(".")}\nКалорії: ${Math.round(kc)} / ${DAY_KCAL} ккал\nБілки: ${Math.round(pr*10)/10} г\n\n` + lines.join("\n");
  if (notesEl.value.trim()) t += `\n\nПоза програмою: ${notesEl.value.trim()}`;
  return t;
}
document.getElementById("send").addEventListener("click", () => {
  const text = report();
  if (tg && tg.initData) tg.sendData(JSON.stringify({report: text}));
  else { navigator.clipboard && navigator.clipboard.writeText(text); alert(text); }
});
</script>
</body>
</html>
